name: Integración Continua y Validación Astro SSG

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-verify:
    name: Build Astro SSG, Enlaces y Seguridad
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar proyecto Astro SSG
        run: npm run build

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validar integridad de compilación, sitemap y seguridad
        run: |
          python3 - << 'EOF'
          import os, re, json, sys

          # 1. Validar archivos esenciales en dist/
          required_dist = [
              'dist/index.html',
              'dist/robots.txt',
              'dist/sitemap-index.xml',
              'dist/site.webmanifest',
              'dist/.well-known/security.txt'
          ]
          for f in required_dist:
              assert os.path.exists(f), f"Falta archivo crítico en dist: {f}"

          # 2. Validar sintaxis de vercel.json
          with open('vercel.json', encoding='utf-8') as vf:
              vdata = json.load(vf)
              assert 'headers' in vdata, "vercel.json debe incluir cabeceras de seguridad"

          # 3. Verificar que los enlaces externos tengan rel="noopener noreferrer"
          for root, dirs, files in os.walk('dist'):
              for file in files:
                  if file.endswith('.html'):
                      fpath = os.path.join(root, file)
                      with open(fpath, encoding='utf-8') as hf:
                          content = hf.read()
                          blank_links = re.findall(r'<a\s+[^>]*target="_blank"[^>]*>', content)
                          for link in blank_links:
                              assert 'noopener' in link and 'noreferrer' in link, f"Enlace externo inseguro en {fpath}: {link}"

          print("Todas las validaciones de build, sitemap, recursos y seguridad pasaron exitosamente.")
          EOF
