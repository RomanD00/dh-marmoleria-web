<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
  <rect width="800" height="600" fill="#F6F3ED"/>
  <!-- Ejes arquitectónicos referenciales -->
  <line x1="60" y1="300" x2="740" y2="300" stroke="#E5DFC0" stroke-width="0.8" stroke-dasharray="4 6"/>
  <line x1="400" y1="60" x2="400" y2="540" stroke="#E5DFC0" stroke-width="0.8" stroke-dasharray="4 6"/>
  
  <!-- Countertop Cutout Frame (Minimalist) -->
  <rect x="180" y="130" width="440" height="340" rx="8" fill="#EFECE5" stroke="#121210" stroke-width="1.8"/>
  
  <!-- Flange -->
  <rect x="194" y="144" width="412" height="312" rx="6" fill="#E5E0D6" stroke="rgba(18,18,16,0.3)" stroke-width="1"/>
  
  <!-- Minimalist Basin -->
  <rect x="215" y="165" width="370" height="270" rx="8" fill="url(#minGrad)" stroke="#121210" stroke-width="1.4"/>
  
  <!-- Square Minimal Drain Cover (Neue Signature) -->
  <rect x="375" y="275" width="50" height="50" rx="4" fill="#B7AFA0" stroke="#121210" stroke-width="1.5"/>
  <rect x="385" y="285" width="30" height="30" rx="2" fill="#8C8578" stroke="#121210" stroke-width="0.8"/>

  <!-- Indicador Conceptual Sin Escala -->
  <text x="400" y="84" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="11" font-weight="600" fill="#773508" text-anchor="middle" letter-spacing="0.16em">MODELO CONCEPTUAL · MINIMAL</text>
  <text x="400" y="525" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#706E6B" text-anchor="middle" letter-spacing="0.18em">ESQUEMA ARQUITECTÓNICO · SIN ESCALA</text>

  <defs>
    <linearGradient id="minGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E3DDD2"/>
      <stop offset="100%" stop-color="#CBC4B5"/>
    </linearGradient>
  </defs>
</svg>
