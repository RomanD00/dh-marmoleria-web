<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
  <rect width="800" height="600" fill="#F6F3ED"/>
  <!-- Ejes arquitectónicos referenciales -->
  <line x1="60" y1="300" x2="740" y2="300" stroke="#E5DFC0" stroke-width="0.8" stroke-dasharray="4 6"/>
  <line x1="400" y1="60" x2="400" y2="540" stroke="#E5DFC0" stroke-width="0.8" stroke-dasharray="4 6"/>
  
  <!-- Countertop Cutout Frame (Double) -->
  <rect x="110" y="120" width="580" height="360" rx="10" fill="#EFECE5" stroke="#121210" stroke-width="1.8"/>
  
  <!-- Flange -->
  <rect x="124" y="134" width="552" height="332" rx="8" fill="#E5E0D6" stroke="rgba(18,18,16,0.3)" stroke-width="1"/>
  
  <!-- Left Basin -->
  <rect x="145" y="155" width="235" height="290" rx="8" fill="url(#duoGrad)" stroke="#121210" stroke-width="1.4"/>
  <circle cx="262" cy="300" r="28" fill="#CBC4B5" stroke="#121210" stroke-width="1.2"/>
  <circle cx="262" cy="300" r="16" fill="#B7AFA0" stroke="#121210" stroke-width="1"/>
  
  <!-- Central Bridge (Tabique divisorio) -->
  <rect x="390" y="155" width="20" height="290" fill="#DDD7CB" stroke="#121210" stroke-width="1.2"/>
  
  <!-- Right Basin -->
  <rect x="420" y="155" width="235" height="290" rx="8" fill="url(#duoGrad)" stroke="#121210" stroke-width="1.4"/>
  <circle cx="538" cy="300" r="28" fill="#CBC4B5" stroke="#121210" stroke-width="1.2"/>
  <circle cx="538" cy="300" r="16" fill="#B7AFA0" stroke="#121210" stroke-width="1"/>

  <!-- Indicador Conceptual Sin Escala -->
  <text x="400" y="84" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="11" font-weight="600" fill="#773508" text-anchor="middle" letter-spacing="0.16em">MODELO CONCEPTUAL · QUADRO DUO</text>
  <text x="400" y="525" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#706E6B" text-anchor="middle" letter-spacing="0.18em">ESQUEMA ARQUITECTÓNICO · SIN ESCALA</text>

  <defs>
    <linearGradient id="duoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E3DDD2"/>
      <stop offset="100%" stop-color="#CBC4B5"/>
    </linearGradient>
  </defs>
</svg>
