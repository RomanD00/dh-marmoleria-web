<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
  <rect width="800" height="600" fill="#F6F3ED"/>
  <!-- Ejes arquitectónicos referenciales -->
  <line x1="60" y1="300" x2="740" y2="300" stroke="#E5DFC0" stroke-width="0.8" stroke-dasharray="4 6"/>
  <line x1="400" y1="60" x2="400" y2="540" stroke="#E5DFC0" stroke-width="0.8" stroke-dasharray="4 6"/>
  
  <!-- Countertop Cutout Frame (Square-curve) -->
  <rect x="220" y="120" width="360" height="360" rx="50" fill="#EFECE5" stroke="#121210" stroke-width="1.8"/>
  
  <!-- Outer Flange -->
  <rect x="236" y="136" width="328" height="328" rx="44" fill="#E5E0D6" stroke="rgba(18,18,16,0.3)" stroke-width="1"/>
  
  <!-- Basin -->
  <rect x="260" y="160" width="280" height="280" rx="40" fill="url(#curveGrad)" stroke="#121210" stroke-width="1.4"/>
  
  <!-- Central Drain -->
  <circle cx="400" cy="300" r="32" fill="#CBC4B5" stroke="#121210" stroke-width="1.5"/>
  <circle cx="400" cy="300" r="20" fill="#B7AFA0" stroke="#121210" stroke-width="1"/>
  <circle cx="400" cy="300" r="5" fill="#121210"/>

  <!-- Indicador Conceptual Sin Escala -->
  <text x="400" y="84" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="11" font-weight="600" fill="#773508" text-anchor="middle" letter-spacing="0.16em">MODELO CONCEPTUAL · CURVE</text>
  <text x="400" y="525" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#706E6B" text-anchor="middle" letter-spacing="0.18em">ESQUEMA ARQUITECTÓNICO · SIN ESCALA</text>

  <defs>
    <linearGradient id="curveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E3DDD2"/>
      <stop offset="100%" stop-color="#CBC4B5"/>
    </linearGradient>
  </defs>
</svg>
