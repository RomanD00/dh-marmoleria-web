<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
  <rect width="800" height="600" fill="#F6F3ED"/>
  <!-- Ejes arquitectónicos referenciales -->
  <line x1="60" y1="300" x2="740" y2="300" stroke="#E5DFC0" stroke-width="0.8" stroke-dasharray="4 6"/>
  <line x1="400" y1="60" x2="400" y2="540" stroke="#E5DFC0" stroke-width="0.8" stroke-dasharray="4 6"/>
  
  <!-- Countertop Cutout Frame -->
  <rect x="130" y="120" width="540" height="360" rx="14" fill="#EFECE5" stroke="#121210" stroke-width="1.8"/>
  
  <!-- Outer Flange -->
  <rect x="144" y="134" width="512" height="332" rx="10" fill="#E5E0D6" stroke="rgba(18,18,16,0.3)" stroke-width="1"/>
  
  <!-- Main Rectangular Basin -->
  <rect x="170" y="160" width="460" height="280" rx="16" fill="url(#quadraGrad)" stroke="#121210" stroke-width="1.4"/>
  
  <!-- Central Drain -->
  <circle cx="400" cy="300" r="34" fill="#CBC4B5" stroke="#121210" stroke-width="1.5"/>
  <circle cx="400" cy="300" r="22" fill="#B7AFA0" stroke="#121210" stroke-width="1"/>
  <circle cx="400" cy="300" r="6" fill="#121210"/>
  
  <!-- Crease X Lines -->
  <line x1="185" y1="175" x2="380" y2="285" stroke="rgba(18,18,16,0.25)" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="185" y1="425" x2="380" y2="315" stroke="rgba(18,18,16,0.25)" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="615" y1="175" x2="420" y2="285" stroke="rgba(18,18,16,0.25)" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="615" y1="425" x2="420" y2="315" stroke="rgba(18,18,16,0.25)" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Indicador Conceptual Sin Escala -->
  <text x="400" y="84" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="11" font-weight="600" fill="#773508" text-anchor="middle" letter-spacing="0.16em">MODELO CONCEPTUAL · QUADRA</text>
  <text x="400" y="525" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#706E6B" text-anchor="middle" letter-spacing="0.18em">ESQUEMA ARQUITECTÓNICO · SIN ESCALA</text>

  <defs>
    <linearGradient id="quadraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E3DDD2"/>
      <stop offset="100%" stop-color="#CBC4B5"/>
    </linearGradient>
  </defs>
</svg>
