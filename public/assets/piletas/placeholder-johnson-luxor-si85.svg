<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
  <rect width="800" height="600" fill="#F6F3ED"/>
  <!-- Ejes arquitectónicos referenciales -->
  <line x1="60" y1="300" x2="740" y2="300" stroke="#E5DFC0" stroke-width="0.8" stroke-dasharray="4 6"/>
  <line x1="400" y1="60" x2="400" y2="540" stroke="#E5DFC0" stroke-width="0.8" stroke-dasharray="4 6"/>
  
  <!-- Countertop Cutout Frame (Traforo) -->
  <rect x="110" y="110" width="580" height="380" rx="24" fill="#EFECE5" stroke="#121210" stroke-width="1.8"/>
  
  <!-- Outer Rim / Flange of Sink -->
  <rect x="124" y="124" width="552" height="352" rx="20" fill="#E5E0D6" stroke="rgba(18,18,16,0.3)" stroke-width="1"/>
  
  <!-- Main Basin -->
  <rect x="150" y="150" width="500" height="300" rx="28" fill="#DAD4C8" stroke="#121210" stroke-width="1.4"/>
  <rect x="165" y="165" width="470" height="270" rx="20" fill="url(#luxorGrad)" stroke="rgba(18,18,16,0.2)" stroke-width="0.8"/>
  
  <!-- Drain Strainer -->
  <circle cx="520" cy="300" r="36" fill="#CBC4B5" stroke="#121210" stroke-width="1.5"/>
  <circle cx="520" cy="300" r="24" fill="#B7AFA0" stroke="#121210" stroke-width="1"/>
  <circle cx="520" cy="300" r="6" fill="#121210"/>
  
  <!-- Crease Lines -->
  <line x1="170" y1="170" x2="500" y2="285" stroke="rgba(18,18,16,0.25)" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="170" y1="430" x2="500" y2="315" stroke="rgba(18,18,16,0.25)" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="630" y1="170" x2="540" y2="285" stroke="rgba(18,18,16,0.25)" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="630" y1="430" x2="540" y2="315" stroke="rgba(18,18,16,0.25)" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Indicador Conceptual Sin Escala -->
  <text x="400" y="84" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="11" font-weight="600" fill="#773508" text-anchor="middle" letter-spacing="0.16em">MODELO CONCEPTUAL · LUXOR</text>
  <text x="400" y="525" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#706E6B" text-anchor="middle" letter-spacing="0.18em">ESQUEMA ARQUITECTÓNICO · SIN ESCALA</text>

  <defs>
    <linearGradient id="luxorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E3DDD2"/>
      <stop offset="100%" stop-color="#CBC4B5"/>
    </linearGradient>
  </defs>
</svg>
